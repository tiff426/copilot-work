<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whack a Mole</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:linear-gradient(180deg,#f8f5ff,#eef7ff);font-family:Georgia,serif}
    .mole{aspect-ratio:1;min-height:5rem}
    .active{background:#ffcf33!important;border-color:#e2a900!important;color:#1f1f1f!important}
  </style>
</head>
<body class="min-vh-100 d-flex flex-column">
  <nav class="navbar navbar-dark bg-dark navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Home</a>
      <a class="btn btn-outline-light btn-sm" href="index.html">Back</a>
    </div>
  </nav>

  <main class="container py-4 flex-grow-1">
    <div class="row justify-content-center g-4">
      <div class="col-12 col-lg-8 text-center">
        <h1 class="display-6 fw-bold mb-3">Whack a Mole</h1>
        <div class="d-flex justify-content-center gap-3 mb-3">
          <span class="badge text-bg-primary fs-6">Score: <span id="score">0</span></span>
          <span class="badge text-bg-danger fs-6">Time: <span id="time">30</span></span>
        </div>
        <button id="start" class="btn btn-success btn-lg mb-4">Start Game</button>
        <div class="row row-cols-3 g-2" id="board">
          <button class="col btn btn-outline-dark mole"></button>
          <button class="col btn btn-outline-dark mole"></button>
          <button class="col btn btn-outline-dark mole"></button>
          <button class="col btn btn-outline-dark mole"></button>
          <button class="col btn btn-outline-dark mole"></button>
          <button class="col btn btn-outline-dark mole"></button>
          <button class="col btn btn-outline-dark mole"></button>
          <button class="col btn btn-outline-dark mole"></button>
          <button class="col btn btn-outline-dark mole"></button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const holes=[...document.querySelectorAll('.mole')], scoreEl=document.getElementById('score'), timeEl=document.getElementById('time'), start=document.getElementById('start');
    let score=0, time=30, active=-1, timer=null, clock=null;
    const clear=()=>holes.forEach(b=>b.classList.remove('active'));
    const next=()=>{ clear(); active=Math.floor(Math.random()*holes.length); holes[active].classList.add('active'); };
    const stop=()=>{ clearInterval(timer); clearInterval(clock); timer=clock=null; start.disabled=false; start.textContent='Start Game'; };
    holes.forEach((hole,i)=>hole.addEventListener('click',()=>{ if(i===active&&timer){ score++; scoreEl.textContent=score; next(); } }));
    start.addEventListener('click',()=>{
      score=0; time=30; scoreEl.textContent=score; timeEl.textContent=time; start.disabled=true; start.textContent='Playing...'; next();
      timer=setInterval(next,700);
      clock=setInterval(()=>{ time--; timeEl.textContent=time; if(time<=0) stop(); },1000);
    });
  </script>
</body>
</html>
